[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eudamed-toolkit"
version = "0.1.0"
description = "Client and extraction tools for the EU database on medical devices (EUDAMED)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jacob Widaeus", email = "jacob.widaeus@ki.se" }]
keywords = ["eudamed", "medical devices", "mdr", "ivdr", "regulatory", "udi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
parquet = ["pandas>=2.0", "pyarrow>=14.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pandas>=2.0", "pyarrow>=14.0"]

[project.scripts]
eudamed = "eudamed.cli:main"

[project.urls]
Source = "https://github.com/Widaeus/eudamed-toolkit"
Issues = "https://github.com/Widaeus/eudamed-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eudamed"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
